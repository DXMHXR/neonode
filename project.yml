name: neo-node
options:
  bundleIdPrefix: com.kylswich
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VNB5T45XDL
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  neo-node:
    type: application
    platform: macOS
    sources:
      - neo-node
    info:
      path: neo-node/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: neo-node finds and controls your Philips WiZ lights and Samsung TVs on your Wi‑Fi.
    entitlements:
      path: neo-node/neo-node.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          - VNB5T45XDL.com.kylswich.neonode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylswich.neonode
        PRODUCT_NAME: neo-node
        PRODUCT_MODULE_NAME: NeoNode
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: neo-node
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
